app-id: com.github.alainm23.byte
runtime: org.freedesktop.Platform
runtime-version: '26.08'
base: io.elementary.BaseApp
base-version: tanit-26.08
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.vala
build-options:
  prepend-path: /usr/lib/sdk/vala/bin/
  prepend-ld-library-path: /usr/lib/sdk/vala/lib
command: com.github.alainm23.byte
finish-args:
  - --device=dri
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
  - --metadata=X-DConf=migrate-path=/com/github/alainm23/byte/
  - --talk-name=org.gtk.vfs.*
  - --socket=pulseaudio
cleanup:
  - '*.la'
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - shared-modules/libsoup/libsoup-2.4.json
  # Required by the byte. The base app no longer provides it.
  - name: libgee
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libgee/0.20/libgee-0.20.8.tar.xz
        sha256: 189815ac143d89867193b0c52b7dc31f3aa108a15f04d6b5dca2b6adfad0b0ee

  - name: byte
    buildsystem: meson
    post-install:
      - mkdir -p /app/share/icons/hicolor/scalable/apps
      - mv /app/share/icons/hicolor/128x128@2/apps/${FLATPAK_ID}.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - find /app/share/icons/hicolor -type f -not -path "*scalable*" -not -path "*actions*" -name "*.svg" -delete
    sources:
      - type: archive
        url: https://github.com/alainm23/byte/archive/0.4.2.tar.gz
        sha256: ea70db7a30f4a6bd4f252016f7cb8359d5b0c250a315ee5cce53e79bc0be055c
      - type: patch
        path: appdata.patch
